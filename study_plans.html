<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Plans — NOVA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .study-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
      flex-wrap: wrap;
    }

    .study-plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: var(--space-lg);
    }

    .study-plan-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .study-plan-card:hover {
      border-color: var(--border-glass);
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .study-plan-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-primary);
      opacity: 0.6;
    }

    .study-plan-subject {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-xs);
    }

    .study-plan-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: var(--space-lg);
    }

    .study-progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-sm);
    }

    .study-progress-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .study-progress-percent {
      font-family: var(--font-display);
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .study-timeline {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-top: var(--space-lg);
    }

    .timeline-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      font-size: 0.85rem;
    }

    .timeline-day {
      width: 42px;
      font-weight: 700;
      color: var(--text-dim);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    .timeline-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid var(--border-glass);
    }

    .timeline-dot.completed {
      background: var(--accent-green);
      border-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }

    .timeline-dot.today {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.6);
      animation: pulse 2s infinite;
    }

    .timeline-topic {
      flex: 1;
      color: var(--text-secondary);
    }

    .timeline-topic.completed {
      color: var(--text-dim);
      text-decoration: line-through;
    }

    .timeline-topic.today {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .timeline-status {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-dim);
    }

    @media (max-width: 768px) {
      .study-header {
        flex-direction: column;
        align-items: stretch;
      }

      .study-plans-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">N</div>
        <div class="sidebar-brand">NOVA</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">⌂</span><span class="nav-label">Dashboard</span></a>
        <div class="nav-section-label">Organize</div>
        <a href="reminders.html" class="nav-item"><span class="nav-icon">⏰</span><span class="nav-label">Reminders</span></a>
        <a href="notes.html" class="nav-item"><span class="nav-icon">📝</span><span class="nav-label">Notes</span></a>
        <a href="shopping.html" class="nav-item"><span class="nav-icon">🛒</span><span class="nav-label">Shopping</span></a>
        <a href="expenses.html" class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Expenses</span></a>
        <a href="study_plans.html" class="nav-item active"><span class="nav-icon">📚</span><span class="nav-label">Study Plans</span></a>
        <a href="goals.html" class="nav-item"><span class="nav-icon">🎯</span><span class="nav-label">Goals</span></a>
        <div class="nav-divider"></div>
        <a href="profile.html" class="nav-item"><span class="nav-icon">⚙</span><span class="nav-label">Profile</span></a>
        <a href="login.html" class="nav-item"><span class="nav-icon">↪</span><span class="nav-label">Logout</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar avatar-sm">AS</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName">Arjun Sharma</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-content" id="mainContent">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" aria-label="Toggle menu">☰</button>
          <div class="topbar-greeting">
            <div class="greeting-title">Study Smarter, Not Harder.</div>
            <div class="greeting-subtitle">Plan, track, and achieve your study goals.</div>
          </div>
        </div>
        <div class="topbar-right">
          <button class="topbar-icon-btn" data-notifications aria-label="Notifications">🔔<span class="notification-dot"></span></button>
          <div class="topbar-avatar"><div class="avatar">AS</div></div>
        </div>
      </header>

      <div class="page-content">
        <div class="study-header">
          <h2 style="font-family: var(--font-display);">Your Study Plans</h2>
          <button class="btn btn-primary" id="createStudyPlanBtn">+ Create Study Plan</button>
        </div>

        <div class="study-plans-grid" id="studyPlansGrid">
          <!-- Plans injected by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- Create Study Plan Modal -->
  <div class="modal-overlay" id="studyPlanModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">📚 Create Study Plan</h3>
        <button class="modal-close" data-close-modal aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="planSubject">Subject <span class="required">*</span></label>
          <input type="text" id="planSubject" class="form-input" placeholder="e.g. Python" required>
          <div class="form-error" id="planSubjectError">Subject is required.</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="planExamDate">Exam Date</label>
          <input type="date" id="planExamDate" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="planTopics">Topics (comma separated)</label>
          <input type="text" id="planTopics" class="form-input" placeholder="e.g. Basics, Functions, OOP">
        </div>
        <div class="form-group">
          <label class="form-label" for="planDailyTime">Daily Study Time</label>
          <input type="text" id="planDailyTime" class="form-input" placeholder="e.g. 2 hours" value="1 hour">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-close-modal>Cancel</button>
        <button class="btn btn-primary" id="saveStudyPlanBtn">Create Plan</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/study_plans.js"></script>
</body>
</html>
