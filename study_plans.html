<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Plans — NOVA</title>
<link rel="icon" type="image/svg+xml" href="assets/images/nova-logo.svg">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #05060f; color: #f1f5f9; min-height: 100vh; }
  .dashboard-layout { display: flex; min-height: 100vh; }
  .sidebar { width: 260px; background: rgba(10,12,26,0.85); border-right: 1px solid rgba(255,255,255,0.06); padding: 20px 12px; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; }
  .sidebar-header { display: flex; align-items: center; gap: 12px; padding: 8px 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 12px; }
  .sidebar-logo-img { width: 40px; height: 40px; border-radius: 12px; box-shadow: 0 4px 16px rgba(34,211,238,0.3); }
  .sidebar-brand { font-size: 1.3rem; font-weight: 700; letter-spacing: 0.05em; background: linear-gradient(135deg, #22d3ee, #8b5cf6, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .nav-section-label { font-size: 0.7rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.1em; padding: 16px 12px 6px; }
  .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: #64748b; text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: all 0.2s ease; position: relative; margin-bottom: 2px; }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: #f1f5f9; }
  .nav-item.active { background: rgba(34,211,238,0.08); color: #22d3ee; font-weight: 600; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 60%; background: linear-gradient(135deg,#22d3ee,#8b5cf6); border-radius: 0 4px 4px 0; box-shadow: 0 0 12px rgba(34,211,238,0.5); }
  .nav-icon { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; flex-shrink: 0; }
  .nav-icon svg { width: 18px; height: 18px; stroke-width: 1.8; }
  .nav-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px; }

  .main-content { flex: 1; margin-left: 260px; min-height: 100vh; }
  .topbar { height: 72px; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; border-bottom: 1px solid rgba(255,255,255,0.06); background: rgba(10,12,26,0.6); backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 50; }
  .greeting-title { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }
  .greeting-subtitle { font-size: 0.8rem; color: #94a3b8; }
  .topbar-right { display: flex; align-items: center; gap: 16px; position: relative; }
  .topbar-icon-btn { width: 40px; height: 40px; border-radius: 10px; background: transparent; border: 0; color: #94a3b8; cursor: pointer; display: flex; align-items: center; justify-content: center; position: relative; transition: all 0.2s ease; }
  .topbar-icon-btn:hover { background: rgba(255,255,255,0.05); color: #f1f5f9; }
  .topbar-icon-btn svg { width: 20px; height: 20px; stroke-width: 1.8; }
  .notification-dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,0.6); }
  .avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg,#22d3ee,#8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; color: #fff; cursor: pointer; transition: transform 0.2s ease; user-select: none; }
  .avatar:hover { transform: scale(1.05); }
  .profile-menu { position: absolute; top: calc(100% + 8px); right: 0; width: 200px; background: rgba(18,21,45,0.95); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 6px; backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); z-index: 100; animation: menuFadeIn 0.15s ease; }
  .profile-menu[hidden] { display: none; }
  @keyframes menuFadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  .profile-menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; color: #cbd5e1; text-decoration: none; font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: background 0.15s ease; border: 0; background: transparent; width: 100%; text-align: left; font-family: inherit; }
  .profile-menu-item:hover { background: rgba(255,255,255,0.06); color: #f1f5f9; }
  .profile-menu-item svg { width: 16px; height: 16px; stroke-width: 2; color: #94a3b8; }
  .profile-menu-item:hover svg { color: #22d3ee; }
  .profile-menu-item.danger { color: #f87171; }
  .profile-menu-item.danger svg { color: #f87171; }
  .profile-menu-item.danger:hover { background: rgba(239,68,68,0.1); color: #ef4444; }
  .profile-menu hr { border: 0; height: 1px; background: rgba(255,255,255,0.08); margin: 6px 4px; }

  .page-content { padding: 32px; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .toolbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .count-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.2); border-radius: 9999px; font-size: 0.8rem; font-weight: 600; color: #22d3ee; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 22px; font-size: 0.9rem; font-weight: 600; border-radius: 9999px; border: 0; cursor: pointer; font-family: inherit; transition: all 0.2s ease; }
  .btn-ghost { background: rgba(255,255,255,0.04); color: #94a3b8; border: 1px solid rgba(255,255,255,0.08); }
  .btn-ghost:hover { background: rgba(255,255,255,0.07); color: #f1f5f9; border-color: rgba(34,211,238,0.3); }
  .btn-ghost svg { width: 16px; height: 16px; stroke-width: 2; }

  .plans-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .plan-card { background: rgba(18,21,45,0.65); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; padding: 24px; transition: all 0.3s ease; position: relative; overflow: hidden; }
  .plan-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(135deg,#22d3ee,#8b5cf6); opacity: 0.7; }
  .plan-card:hover { border-color: rgba(255,255,255,0.1); transform: translateY(-4px); box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .plan-header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  .plan-icon { width: 48px; height: 48px; border-radius: 14px; background: linear-gradient(135deg, rgba(34,211,238,0.15), rgba(139,92,246,0.15)); border: 1px solid rgba(34,211,238,0.2); display: flex; align-items: center; justify-content: center; color: #22d3ee; flex-shrink: 0; }
  .plan-icon svg { width: 22px; height: 22px; stroke-width: 1.8; }
  .plan-header-info { flex: 1; min-width: 0; }
  .plan-subject { font-size: 1.15rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; word-break: break-word; }
  .plan-id { font-size: 0.7rem; color: #475569; font-weight: 600; letter-spacing: 0.05em; }
  .plan-detail { display: flex; align-items: center; gap: 8px; padding: 10px 14px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 12px; }
  .plan-detail svg { width: 16px; height: 16px; stroke-width: 2; color: #22d3ee; flex-shrink: 0; }
  .plan-detail-label { color: #64748b; margin-right: 6px; }
  .plan-detail-value { color: #f1f5f9; font-weight: 600; }

  .edit-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #94a3b8; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; opacity: 0; flex-shrink: 0; margin-left: auto; }
  .plan-card:hover .edit-btn { opacity: 1; }
  .edit-btn:hover { background: rgba(34,211,238,0.1); border-color: rgba(34,211,238,0.3); color: #22d3ee; transform: scale(1.05); }
  .edit-btn svg { width: 16px; height: 16px; stroke-width: 2; }
  .delete-btn { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); color: #94a3b8; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: all 0.2s ease; opacity: 0; flex-shrink: 0; }
  .plan-card:hover .delete-btn { opacity: 1; }
  .delete-btn:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #ef4444; transform: scale(1.05); }
  .delete-btn svg { width: 16px; height: 16px; stroke-width: 2; }

  .state-box { padding: 48px 32px; text-align: center; color: #64748b; font-size: 0.95rem; grid-column: 1 / -1; }
  .state-box .state-icon { font-size: 3rem; opacity: 0.5; margin-bottom: 16px; }
  .state-box.error { color: #ef4444; }
  .state-box.loading { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,0.08); border-top-color: #22d3ee; border-radius: 50%; animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; opacity: 0; visibility: hidden; transition: all 0.3s ease; }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  .modal { background: #0a0c1a; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; transform: translateY(20px); transition: transform 0.3s ease; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .modal-title { font-size: 1.15rem; font-weight: 700; color: #f1f5f9; }
  .modal-close { width: 36px; height: 36px; border-radius: 8px; background: transparent; border: 0; color: #64748b; cursor: pointer; font-size: 1.2rem; transition: all 0.2s ease; }
  .modal-close:hover { background: rgba(239,68,68,0.1); color: #ef4444; }
  .modal-body { padding: 24px; }
  .modal-footer { display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.06); }
  .form-group { margin-bottom: 20px; }
  .form-group:last-child { margin-bottom: 0; }
  .form-label { display: block; font-size: 0.85rem; font-weight: 600; color: #94a3b8; margin-bottom: 8px; }
  .form-input { width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: #f1f5f9; font-size: 0.95rem; font-family: inherit; outline: none; transition: all 0.2s ease; }
  .form-input:focus { border-color: #22d3ee; background: rgba(34,211,238,0.05); box-shadow: 0 0 0 3px rgba(34,211,238,0.1); }
  .form-input::-webkit-calendar-picker-indicator { filter: invert(0.6); cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg,#22d3ee,#8b5cf6); color: #fff; padding: 10px 24px; border-radius: 9999px; border: 0; cursor: pointer; font-weight: 600; font-size: 0.9rem; font-family: inherit; transition: all 0.2s ease; }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 30px rgba(34,211,238,0.4); transform: translateY(-2px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
  .btn-secondary { background: transparent; color: #94a3b8; padding: 10px 24px; border-radius: 9999px; border: 1px solid rgba(255,255,255,0.1); cursor: pointer; font-weight: 600; font-size: 0.9rem; font-family: inherit; transition: all 0.2s ease; }
  .btn-secondary:hover { background: rgba(255,255,255,0.04); color: #f1f5f9; }

  .toast-container { position: fixed; top: 20px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }

  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main-content { margin-left: 0; }
    .page-content { padding: 20px 16px; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-left { flex-direction: column; align-items: stretch; }
    .plans-grid { grid-template-columns: 1fr; }
    .edit-btn, .delete-btn { opacity: 1; }
  }
</style>
</head>
<body>

<div class="dashboard-layout">

  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="assets/images/nova-logo.svg" alt="NOVA" class="sidebar-logo-img">
      <div class="sidebar-brand">NOVA</div>
    </div>
    <nav>
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard" class="nav-icon"></i><span>Dashboard</span></a>
      <a href="assistant.html" class="nav-item"><i data-lucide="sparkles" class="nav-icon"></i><span>Assistant</span></a>
      <div class="nav-section-label">Organize</div>
      <a href="reminders.html" class="nav-item"><i data-lucide="clock" class="nav-icon"></i><span>Reminders</span></a>
      <a href="notes.html" class="nav-item"><i data-lucide="file-text" class="nav-icon"></i><span>Notes</span></a>
      <a href="shopping.html" class="nav-item"><i data-lucide="shopping-cart" class="nav-icon"></i><span>Shopping</span></a>
      <a href="expenses.html" class="nav-item"><i data-lucide="wallet" class="nav-icon"></i><span>Expenses</span></a>
      <a href="study_plans.html" class="nav-item active"><i data-lucide="book-open" class="nav-icon"></i><span>Study Plans</span></a>
      <a href="goals.html" class="nav-item"><i data-lucide="target" class="nav-icon"></i><span>Goals</span></a>
      <div class="nav-divider"></div>
      <a href="profile.html" class="nav-item"><i data-lucide="settings" class="nav-icon"></i><span>Profile</span></a>
      <a href="login.html" class="nav-item" id="sidebarLogout"><i data-lucide="log-out" class="nav-icon"></i><span>Logout</span></a>
    </nav>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="greeting-title">Study Plans</div>
        <div class="greeting-subtitle">Study smarter, not harder.</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-icon-btn" id="notifBtn"><i data-lucide="bell"></i><span class="notification-dot"></span></button>
        <div class="avatar" id="avatarInitial">U</div>
        <div class="profile-menu" id="profileMenu" hidden>
          <a href="profile.html" class="profile-menu-item"><i data-lucide="user"></i> Profile</a>
          <a href="profile.html#settings" class="profile-menu-item"><i data-lucide="settings"></i> Settings</a>
          <hr>
          <button class="profile-menu-item danger" id="logoutMenuBtn" type="button"><i data-lucide="log-out"></i> Logout</button>
        </div>
      </div>
    </header>

    <div class="page-content">
      <div class="toolbar">
        <div class="toolbar-left">
          <div class="count-badge">
            <i data-lucide="book-open" style="width:14px;height:14px;"></i>
            <span id="countText">Loading...</span>
          </div>
        </div>
        <button class="btn btn-ghost" id="refreshBtn"><i data-lucide="refresh-cw"></i> Refresh</button>
      </div>

      <div class="plans-grid" id="data-list"></div>
    </div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Edit Study Plan</h3>
      <button class="modal-close" id="modalCloseBtn" type="button">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Subject</label>
        <input type="text" id="editSubject" class="form-input" placeholder="e.g. Python">
      </div>
      <div class="form-group">
        <label class="form-label">Exam Date</label>
        <input type="date" id="editExamDate" class="form-input">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="modalCancelBtn" type="button">Cancel</button>
      <button class="btn-primary" id="modalSaveBtn" type="button">Save Changes</button>
    </div>
  </div>
</div>

<script>
var API_BASE = "https://nova-voice-assistant-6vve.onrender.com";
var INTENT   = "GET_STUDY_PLANS";
var DELETE_INTENT = "DELETE_STUDY_PLAN";
var DATA_KEY = "study_plans";
var lastItems = [];
var editingId = null;

document.addEventListener("DOMContentLoaded", function () {
  var name = localStorage.getItem("nova-user-name") || "User";
  var avatar = document.getElementById("avatarInitial");
  if (avatar) avatar.textContent = (name.charAt(0) || "U").toUpperCase();

  if (window.lucide) lucide.createIcons();

  initLogout();
  initProfileMenu();
  initEditModal();

  var notifBtn = document.getElementById("notifBtn");
  if (notifBtn) notifBtn.addEventListener("click", function () {
    showToast("info", "🔔 Notifications", "You have 3 new notifications.");
  });

  var refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) refreshBtn.addEventListener("click", loadData);

  loadData();
});

async function loadData() {
  var token = localStorage.getItem("nova-auth-token") || localStorage.getItem("access_token");
  if (!token) { window.location.href = "login.html"; return; }

  var container = document.getElementById("data-list");
  var countText = document.getElementById("countText");
  if (!container) return;

  container.innerHTML = '<div class="state-box loading"><div class="spinner"></div><div>Loading your study plans...</div></div>';
  if (countText) countText.textContent = "Loading...";

  try {
    var res = await fetch(API_BASE + "/api/assistant", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ intent: INTENT, data: {} })
    });

    if (res.status === 401) {
      localStorage.removeItem("nova-auth-token");
      localStorage.removeItem("access_token");
      window.location.href = "login.html";
      return;
    }

    var data = await res.json();

    if (!data.success) {
      container.innerHTML = '<div class="state-box error">⚠️ ' + (data.error || "Could not load study plans.") + '</div>';
      if (countText) countText.textContent = "Error";
      return;
    }

    var items = data[DATA_KEY] || [];
    lastItems = items;

    if (countText) countText.textContent = items.length + (items.length === 1 ? " plan" : " plans");

    if (items.length === 0) {
      container.innerHTML = '<div class="state-box"><div class="state-icon">📚</div><div>No study plans yet. Ask NOVA to create one!</div></div>';
      return;
    }

    var html = "";
    items.forEach(function (p) { html += renderRow(p); });
    container.innerHTML = html;

    if (window.lucide) lucide.createIcons();
    attachListeners();
  } catch (err) {
    console.error("Load error:", err);
    container.innerHTML = '<div class="state-box error">⚠️ Could not connect to server.<br><span style="font-size:0.85rem;color:#94a3b8;">If the server is cold, wait 30 seconds and click Refresh.</span></div>';
    if (countText) countText.textContent = "Offline";
  }
}

function renderRow(p) {
  var subject = p.subject || "(untitled subject)";
  var examDate = p.exam_date || "";
  var created = p.created_at || "";
  var id = p.id || "";

  var daysLeft = "";
  if (examDate) {
    var exam = new Date(examDate);
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var diff = Math.ceil((exam - today) / (1000 * 60 * 60 * 24));
    if (!isNaN(diff)) {
      if (diff > 0) daysLeft = diff + (diff === 1 ? " day left" : " days left");
      else if (diff === 0) daysLeft = "Exam today";
      else daysLeft = Math.abs(diff) + " days past";
    }
  }

  return (
    '<div class="plan-card" data-id="' + id + '">' +
      '<div class="plan-header">' +
        '<div class="plan-icon"><i data-lucide="book-open"></i></div>' +
        '<div class="plan-header-info">' +
          '<div class="plan-subject">' + escapeHtml(subject) + '</div>' +
          (id ? '<div class="plan-id">PLAN #' + escapeHtml(String(id)) + '</div>' : '') +
        '</div>' +
        (id ?
          '<button class="edit-btn" data-edit-id="' + id + '" title="Edit">' +
            '<i data-lucide="pencil"></i>' +
          '</button>' +
          '<button class="delete-btn" data-delete-id="' + id + '" title="Delete">' +
            '<i data-lucide="trash-2"></i>' +
          '</button>' : ''
        ) +
      '</div>' +

      (examDate ?
        '<div class="plan-detail">' +
          '<i data-lucide="calendar"></i>' +
          '<span class="plan-detail-label">Exam:</span>' +
          '<span class="plan-detail-value">' + escapeHtml(examDate) + '</span>' +
          (daysLeft ? '<span style="margin-left:auto;color:#22d3ee;font-weight:700;font-size:0.75rem;">' + daysLeft + '</span>' : '') +
        '</div>' : ''
      ) +

      (created ?
        '<div class="plan-detail">' +
          '<i data-lucide="clock"></i>' +
          '<span class="plan-detail-label">Created:</span>' +
          '<span class="plan-detail-value">' + escapeHtml(created) + '</span>' +
        '</div>' : ''
      ) +
    '</div>'
  );
}

function attachListeners() {
  document.querySelectorAll("[data-edit-id]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      openEditModal(Number(btn.dataset.editId));
    });
  });

  document.querySelectorAll("[data-delete-id]").forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      deleteItem(DELETE_INTENT, Number(btn.dataset.deleteId));
    });
  });
}

async function deleteItem(intent, id) {
  if (!confirm("Delete this item? This cannot be undone.")) return;

  var token = localStorage.getItem("nova-auth-token") || localStorage.getItem("access_token");
  if (!token) { window.location.href = "login.html"; return; }

  try {
    var res = await fetch(API_BASE + "/api/assistant", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ intent: intent, data: { id: id } })
    });
    var data = await res.json();

    if (data.success) {
      showToast("success", "Deleted", "Item removed.");
      loadData();
    } else {
      showToast("error", "Delete failed", data.message || "Please try again.");
    }
  } catch (e) {
    console.error(e);
    showToast("error", "Network error", "Could not connect to server.");
  }
}

function initEditModal() {
  document.getElementById("modalCloseBtn").addEventListener("click", closeEditModal);
  document.getElementById("modalCancelBtn").addEventListener("click", closeEditModal);
  document.getElementById("modalSaveBtn").addEventListener("click", saveEdit);
  document.getElementById("editModal").addEventListener("click", function (e) {
    if (e.target === this) closeEditModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      var m = document.getElementById("editModal");
      if (m.classList.contains("active")) closeEditModal();
    }
  });
}

function openEditModal(id) {
  var item = lastItems.find(function (x) { return x.id === id; });
  if (!item) return;
  editingId = id;
  document.getElementById("editSubject").value = item.subject || "";
  document.getElementById("editExamDate").value = item.exam_date || "";
  document.getElementById("editModal").classList.add("active");
  document.body.style.overflow = "hidden";
  setTimeout(function () { document.getElementById("editSubject").focus(); }, 100);
}

function closeEditModal() {
  document.getElementById("editModal").classList.remove("active");
  document.body.style.overflow = "";
  editingId = null;
}

async function saveEdit() {
  if (!editingId) return;

  var subject = document.getElementById("editSubject").value.trim();
  var examDate = document.getElementById("editExamDate").value;

  if (!subject) { showToast("warning", "Subject is required", ""); return; }
  if (!examDate) { showToast("warning", "Exam date is required", ""); return; }

  var saveBtn = document.getElementById("modalSaveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Saving...";

  try {
    var token = localStorage.getItem("nova-auth-token") || localStorage.getItem("access_token");
    var res = await fetch(API_BASE + "/api/assistant", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({
        intent: "UPDATE_STUDY_PLAN",
        data: { id: editingId, subject: subject, exam_date: examDate }
      })
    });

    var data = await res.json();

    if (data.success) {
      closeEditModal();
      showToast("success", "Updated", "Study plan saved successfully.");
      loadData();
    } else {
      showToast("error", "Update failed", data.message || "Please try again.");
    }
  } catch (err) {
    console.error(err);
    showToast("error", "Network error", "Could not connect to server.");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Save Changes";
  }
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

function showToast(type, title, message) {
  var container = document.querySelector(".toast-container");
  if (!container) {
    container = document.createElement("div");
    container.className = "toast-container";
    document.body.appendChild(container);
  }
  var icons = { success: "✅", error: "❌", info: "ℹ️", warning: "⚠️" };
  var t = document.createElement("div");
  t.style.cssText = "display:flex;align-items:center;gap:12px;padding:14px 20px;background:#0a0c1a;border:1px solid rgba(255,255,255,0.1);border-radius:12px;min-width:280px;max-width:380px;pointer-events:auto;box-shadow:0 10px 40px rgba(0,0,0,0.4);color:#f1f5f9;font-size:0.9rem;";
  t.innerHTML = '<span>' + (icons[type] || "ℹ️") + '</span><div><div style="font-weight:600;">' + title + '</div>' + (message ? '<div style="font-size:0.8rem;color:#94a3b8;margin-top:2px;">' + message + '</div>' : '') + '</div>';
  container.appendChild(t);
  setTimeout(function () { t.remove(); }, 4000);
}

function initLogout() {
  function doLogout() {
    ["nova-auth-token","access_token","nova-user-name","nova-user-email","nova-user-id","user_id"].forEach(function (k) {
      localStorage.removeItem(k);
    });
    window.location.href = "login.html";
  }
  var s = document.getElementById("sidebarLogout");
  if (s) s.addEventListener("click", function (e) { e.preventDefault(); doLogout(); });
  var m = document.getElementById("logoutMenuBtn");
  if (m) m.addEventListener("click", doLogout);
}

function initProfileMenu() {
  var avatarCircle = document.getElementById("avatarInitial");
  var profileMenu = document.getElementById("profileMenu");
  if (!avatarCircle || !profileMenu) return;
  avatarCircle.addEventListener("click", function (e) { e.stopPropagation(); profileMenu.hidden = !profileMenu.hidden; });
  document.addEventListener("click", function (e) {
    if (!profileMenu.hidden && !profileMenu.contains(e.target) && e.target !== avatarCircle) profileMenu.hidden = true;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") profileMenu.hidden = true;
  });
}
</script>
