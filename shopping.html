<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shopping — NOVA</title>
<link rel="icon" type="image/svg+xml" href="assets/images/nova-logo.svg">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #05060f;
    color: #f1f5f9;
    min-height: 100vh;
  }
  .dashboard-layout { display: flex; min-height: 100vh; }

  /* ============ SIDEBAR ============ */
  .sidebar {
    width: 260px;
    background: rgba(10,12,26,0.85);
    border-right: 1px solid rgba(255,255,255,0.06);
    padding: 20px 12px;
    position: fixed;
    top: 0; left: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .sidebar-header {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 12px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 12px;
  }
  .sidebar-logo-img {
    width: 40px; height: 40px;
    border-radius: 12px;
    box-shadow: 0 4px 16px rgba(34,211,238,0.3);
  }
  .sidebar-brand {
    font-size: 1.3rem; font-weight: 700; letter-spacing: 0.05em;
    background: linear-gradient(135deg, #22d3ee, #8b5cf6, #ec4899);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .nav-section-label {
    font-size: 0.7rem; font-weight: 700; color: #475569;
    text-transform: uppercase; letter-spacing: 0.1em;
    padding: 16px 12px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 10px;
    color: #64748b; text-decoration: none;
    font-size: 0.9rem; font-weight: 500;
    transition: all 0.2s ease; position: relative;
    margin-bottom: 2px;
  }
  .nav-item:hover { background: rgba(255,255,255,0.04); color: #f1f5f9; }
  .nav-item.active {
    background: rgba(34,211,238,0.08); color: #22d3ee; font-weight: 600;
  }
  .nav-item.active::before {
    content: ''; position: absolute;
    left: 0; top: 50%; transform: translateY(-50%);
    width: 3px; height: 60%;
    background: linear-gradient(135deg,#22d3ee,#8b5cf6);
    border-radius: 0 4px 4px 0;
    box-shadow: 0 0 12px rgba(34,211,238,0.5);
  }
  .nav-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; flex-shrink: 0;
  }
  .nav-icon svg { width: 18px; height: 18px; stroke-width: 1.8; }
  .nav-divider { height: 1px; background: rgba(255,255,255,0.06); margin: 12px; }

  /* ============ MAIN ============ */
  .main-content { flex: 1; margin-left: 260px; min-height: 100vh; }
  .topbar {
    height: 72px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 32px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(10,12,26,0.6);
    backdrop-filter: blur(20px);
    position: sticky; top: 0; z-index: 50;
  }
  .greeting-title { font-size: 1.1rem; font-weight: 700; color: #f1f5f9; }
  .greeting-subtitle { font-size: 0.8rem; color: #94a3b8; }
  .topbar-right { display: flex; align-items: center; gap: 16px; }
  .topbar-icon-btn {
    width: 40px; height: 40px; border-radius: 10px;
    background: transparent; border: 0; color: #94a3b8;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative; transition: all 0.2s ease;
  }
  .topbar-icon-btn:hover { background: rgba(255,255,255,0.05); color: #f1f5f9; }
  .topbar-icon-btn svg { width: 20px; height: 20px; stroke-width: 1.8; }
  .notification-dot {
    position: absolute; top: 8px; right: 8px;
    width: 8px; height: 8px; border-radius: 50%;
    background: #22d3ee; box-shadow: 0 0 8px rgba(34,211,238,0.6);
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg,#22d3ee,#8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.9rem; color: #fff;
  }

  .page-content { padding: 32px; }

  /* ============ TOOLBAR ============ */
  .shopping-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
  }
  .toolbar-left {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .count-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    background: rgba(34,211,238,0.08);
    border: 1px solid rgba(34,211,238,0.2);
    border-radius: 9999px;
    font-size: 0.8rem; font-weight: 600;
    color: #22d3ee;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    gap: 8px; padding: 10px 22px;
    font-size: 0.9rem; font-weight: 600;
    border-radius: 9999px; border: 0; cursor: pointer;
    font-family: inherit; transition: all 0.2s ease;
  }
  .btn-ghost {
    background: rgba(255,255,255,0.04);
    color: #94a3b8;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,0.07);
    color: #f1f5f9;
    border-color: rgba(34,211,238,0.3);
  }
  .btn-ghost svg { width: 16px; height: 16px; stroke-width: 2; }

  /* ============ SHOPPING LIST ============ */
  .shopping-list {
    display: flex; flex-direction: column; gap: 10px;
  }
  .shopping-item {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    background: rgba(18,21,45,0.65);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    transition: all 0.3s ease;
  }
  .shopping-item:hover {
    border-color: rgba(255,255,255,0.1);
    transform: translateX(4px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .shopping-icon {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: rgba(139,92,246,0.08);
    border: 1px solid rgba(139,92,246,0.2);
    display: flex; align-items: center; justify-content: center;
    color: #8b5cf6;
    flex-shrink: 0;
  }
  .shopping-icon svg { width: 20px; height: 20px; stroke-width: 1.8; }

  .shopping-content { flex: 1; min-width: 0; }
  .shopping-name {
    font-size: 1rem; font-weight: 600;
    color: #f1f5f9; margin-bottom: 6px;
    word-break: break-word;
  }
  .shopping-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 0.82rem; color: #64748b;
  }
  .shopping-meta .badge {
    display: inline-flex; align-items: center;
    padding: 3px 10px;
    font-size: 0.7rem; font-weight: 700;
    border-radius: 9999px;
    background: rgba(139,92,246,0.12);
    color: #8b5cf6;
    border: 1px solid rgba(139,92,246,0.2);
  }

  /* ============ STATES ============ */
  .state-box {
    padding: 48px 32px;
    text-align: center;
    color: #64748b;
    font-size: 0.95rem;
  }
  .state-box .state-icon {
    font-size: 3rem; opacity: 0.5;
    margin-bottom: 16px;
  }
  .state-box.error { color: #ef4444; }
  .state-box.loading {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(255,255,255,0.08);
    border-top-color: #8b5cf6;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .main-content { margin-left: 0; }
    .page-content { padding: 20px 16px; }
    .shopping-toolbar { flex-direction: column; align-items: stretch; }
    .toolbar-left { flex-direction: column; align-items: stretch; }
  }
</style>
</head>
<body>

<div class="dashboard-layout">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="assets/images/nova-logo.svg" alt="NOVA" class="sidebar-logo-img">
      <div class="sidebar-brand">NOVA</div>
    </div>
    <nav>
      <div class="nav-section-label">Main</div>
      <a href="dashboard.html" class="nav-item">
        <i data-lucide="layout-dashboard" class="nav-icon"></i><span>Dashboard</span>
      </a>
      <a href="#" class="nav-item">
        <i data-lucide="sparkles" class="nav-icon"></i><span>Assistant</span>
      </a>
      <div class="nav-section-label">Organize</div>
      <a href="reminders.html" class="nav-item">
        <i data-lucide="clock" class="nav-icon"></i><span>Reminders</span>
      </a>
      <a href="notes.html" class="nav-item">
        <i data-lucide="file-text" class="nav-icon"></i><span>Notes</span>
      </a>
      <a href="shopping.html" class="nav-item active">
        <i data-lucide="shopping-cart" class="nav-icon"></i><span>Shopping</span>
      </a>
      <a href="expenses.html" class="nav-item">
        <i data-lucide="wallet" class="nav-icon"></i><span>Expenses</span>
      </a>
      <a href="study_plans.html" class="nav-item">
        <i data-lucide="book-open" class="nav-icon"></i><span>Study Plans</span>
      </a>
      <a href="goals.html" class="nav-item">
        <i data-lucide="target" class="nav-icon"></i><span>Goals</span>
      </a>
      <div class="nav-divider"></div>
      <a href="profile.html" class="nav-item">
        <i data-lucide="settings" class="nav-icon"></i><span>Profile</span>
      </a>
      <a href="login.html" class="nav-item" id="logoutBtn">
        <i data-lucide="log-out" class="nav-icon"></i><span>Logout</span>
      </a>
    </nav>
  </aside>

  <!-- ============ MAIN ============ -->
  <div class="main-content">
    <header class="topbar">
      <div>
        <div class="greeting-title">Shopping List</div>
        <div class="greeting-subtitle">Track what you need to buy.</div>
      </div>
      <div class="topbar-right">
        <button class="topbar-icon-btn" id="notifBtn">
          <i data-lucide="bell"></i>
          <span class="notification-dot"></span>
        </button>
        <div class="avatar" id="avatarInitial">U</div>
      </div>
    </header>

    <div class="page-content">
      <div class="shopping-toolbar">
        <div class="toolbar-left">
          <div class="count-badge">
            <i data-lucide="shopping-cart" style="width:14px;height:14px;"></i>
            <span id="countText">Loading...</span>
          </div>
        </div>
        <button class="btn btn-ghost" id="refreshBtn">
          <i data-lucide="refresh-cw"></i> Refresh
        </button>
      </div>

      <div class="shopping-list" id="data-list"></div>
    </div>
  </div>
</div>

<script>
/* =========================================================
   NOVA — Shopping (wired to POST /api/assistant)
   Intent: GET_SHOPPING_LIST
   Response: { success, count, total, shopping_items: [{ id, item, created_at }] }
   ========================================================= */

var API_BASE = "https://nova-voice-assistant-6vve.onrender.com";
var INTENT   = "GET_SHOPPING_LIST";
var DATA_KEY = "shopping_items";

document.addEventListener("DOMContentLoaded", function () {
  var name = localStorage.getItem("nova-user-name") || "User";
  var avatar = document.getElementById("avatarInitial");
  if (avatar) avatar.textContent = (name.charAt(0) || "U").toUpperCase();

  if (window.lucide) lucide.createIcons();

  var logoutBtn = document.getElementById("logoutBtn");
  if (logoutBtn) {
    logoutBtn.addEventListener("click", function (e) {
      e.preventDefault();
      localStorage.removeItem("nova-auth-token");
      localStorage.removeItem("nova-user-name");
      localStorage.removeItem("nova-user-email");
      localStorage.removeItem("nova-user-id");
      window.location.href = "login.html";
    });
  }

  var notifBtn = document.getElementById("notifBtn");
  if (notifBtn) {
    notifBtn.addEventListener("click", function () {
      showToast("info", "🔔 Notifications", "You have 3 new notifications.");
    });
  }

  var refreshBtn = document.getElementById("refreshBtn");
  if (refreshBtn) {
    refreshBtn.addEventListener("click", loadData);
  }

  loadData();
});

async function loadData() {
  var token = localStorage.getItem("nova-auth-token");
  if (!token) {
    window.location.href = "login.html";
    return;
  }

  var container = document.getElementById("data-list");
  var countText = document.getElementById("countText");
  if (!container) return;

  container.innerHTML = '<div class="state-box loading"><div class="spinner"></div><div>Loading your shopping list...</div></div>';
  if (countText) countText.textContent = "Loading...";

  try {
    var res = await fetch(API_BASE + "/api/assistant", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token
      },
      body: JSON.stringify({ intent: INTENT, data: {} })
    });

    if (res.status === 401) {
      localStorage.removeItem("nova-auth-token");
      window.location.href = "login.html";
      return;
    }

    var data = await res.json();

    if (!data.success) {
      container.innerHTML = '<div class="state-box error">⚠️ ' + (data.error || "Could not load shopping list.") + '</div>';
      if (countText) countText.textContent = "Error";
      return;
    }

    var items = data[DATA_KEY] || [];

    if (countText) {
      countText.textContent = items.length + (items.length === 1 ? " item" : " items");
    }

    if (items.length === 0) {
      container.innerHTML =
        '<div class="state-box">' +
          '<div class="state-icon">🛒</div>' +
          '<div>Your shopping list is empty. Ask NOVA to add items!</div>' +
        '</div>';
      return;
    }

    var html = "";
    items.forEach(function (s) {
      html += renderRow(s);
    });
    container.innerHTML = html;

    if (window.lucide) lucide.createIcons();
  } catch (err) {
    console.error("Load error:", err);
    container.innerHTML =
      '<div class="state-box error">' +
        '⚠️ Could not connect to server.<br>' +
        '<span style="font-size:0.85rem;color:#94a3b8;">If the server is cold, wait 30 seconds and click Refresh.</span>' +
      '</div>';
    if (countText) countText.textContent = "Offline";
  }
}

function renderRow(s) {
  var item = s.item || "(unnamed item)";
  var created = s.created_at || "";
  var id = s.id || "";

  return (
    '<div class="shopping-item">' +
      '<div class="shopping-icon"><i data-lucide="shopping-cart"></i></div>' +
      '<div class="shopping-content">' +
        '<div class="shopping-name">' + escapeHtml(item) + '</div>' +
        '<div class="shopping-meta">' +
          (id ? '<span class="badge">#' + escapeHtml(String(id)) + '</span>' : '') +
          (created ? '<span>Added ' + escapeHtml(created) + '</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showToast(type, title, message) {
  var container = document.querySelector(".toast-container");
  if (!container) {
    container = document.createElement("div");
    container.className = "toast-container";
    container.style.cssText = "position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none;";
    document.body.appendChild(container);
  }
  var icons = { success: "✅", error: "❌", info: "ℹ️", warning: "⚠️" };
  var t = document.createElement("div");
  t.style.cssText = "display:flex;align-items:center;gap:12px;padding:14px 20px;background:#0a0c1a;border:1px solid rgba(255,255,255,0.1);border-radius:12px;min-width:280px;max-width:380px;pointer-events:auto;box-shadow:0 10px 40px rgba(0,0,0,0.4);color:#f1f5f9;font-size:0.9rem;";
  t.innerHTML =
    '<span>' + (icons[type] || "ℹ️") + '</span>' +
    '<div>' +
      '<div style="font-weight:600;">' + title + '</div>' +
      (message ? '<div style="font-size:0.8rem;color:#94a3b8;margin-top:2px;">' + message + '</div>' : '') +
    '</div>';
  container.appendChild(t);
  setTimeout(function () { t.remove(); }, 4000);
}
</script>
</body>
</html>
