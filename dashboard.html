<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — NOVA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">N</div>
        <div class="sidebar-brand">NOVA</div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-item active">
          <span class="nav-icon">⌂</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="#" class="nav-item">
          <span class="nav-icon">✦</span>
          <span class="nav-label">Assistant</span>
        </a>

        <div class="nav-section-label">Organize</div>
        <a href="reminders.html" class="nav-item">
          <span class="nav-icon">⏰</span>
          <span class="nav-label">Reminders</span>
          <span class="nav-badge">3</span>
        </a>
        <a href="notes.html" class="nav-item">
          <span class="nav-icon">📝</span>
          <span class="nav-label">Notes</span>
        </a>
        <a href="shopping.html" class="nav-item">
          <span class="nav-icon">🛒</span>
          <span class="nav-label">Shopping</span>
        </a>
        <a href="expenses.html" class="nav-item">
          <span class="nav-icon">💰</span>
          <span class="nav-label">Expenses</span>
        </a>
        <a href="study_plans.html" class="nav-item">
          <span class="nav-icon">📚</span>
          <span class="nav-label">Study Plans</span>
        </a>
        <a href="goals.html" class="nav-item">
          <span class="nav-icon">🎯</span>
          <span class="nav-label">Goals</span>
        </a>

        <div class="nav-divider"></div>

        <a href="profile.html" class="nav-item">
          <span class="nav-icon">⚙</span>
          <span class="nav-label">Profile</span>
        </a>
        <a href="login.html" class="nav-item" id="logoutBtn">
          <span class="nav-icon">↪</span>
          <span class="nav-label">Logout</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar avatar-sm">AS</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName">Arjun Sharma</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" aria-label="Toggle menu">☰</button>
          <div class="topbar-greeting">
            <div class="greeting-title" id="greetingTitle">Good morning, Arjun 👋</div>
            <div class="greeting-subtitle">Ready when you are.</div>
          </div>
        </div>

        <div class="topbar-right">
          <button class="topbar-icon-btn" data-notifications aria-label="Notifications">
            🔔
            <span class="notification-dot"></span>
          </button>
          <div class="topbar-avatar">
            <div class="avatar">AS</div>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <div class="page-content">

        <!-- Assistant Area -->
        <div class="assistant-area">
          <div class="assistant-header">
            <h2 class="assistant-title">NOVA</h2>
            <p class="assistant-subtitle">How can I help you today?</p>
          </div>

          <div class="orb-container">
            <div class="orb-wrapper orb-state-idle" id="orbWrapper">
              <div class="orb-ring orb-ring-1"></div>
              <div class="orb-ring orb-ring-2"></div>
              <div class="orb-ring orb-ring-3"></div>
              <div class="orb-particle"></div>
              <div class="orb-particle"></div>
              <div class="orb-particle"></div>
              <div class="orb-particle"></div>
              <div class="orb"></div>
            </div>

            <div class="orb-status">
              <div class="orb-status-title" id="orbStatusTitle">NOVA</div>
              <div class="orb-status-text" id="orbStatusText">Ready when you are.</div>
            </div>

            <button class="mic-btn" id="micBtn" aria-label="Talk to NOVA">
              🎤
            </button>
            <div class="mic-label" id="micLabel">Talk to NOVA</div>
          </div>

          <div class="assistant-input-area">
            <div class="assistant-input-group">
              <input type="text" class="assistant-input" id="assistantInput" placeholder="Ask NOVA anything..." aria-label="Message to NOVA">
              <button class="assistant-send" id="assistantSend" aria-label="Send message">
                ➤
              </button>
            </div>

            <div class="quick-actions">
              <button class="quick-action" data-quick="Remind me to study at 7 PM">⏰ Remind me</button>
              <button class="quick-action" data-quick="Create a note">📝 New note</button>
              <button class="quick-action" data-quick="Show my expenses">💰 Expenses</button>
              <button class="quick-action" data-quick="Plan my study">📚 Study plan</button>
            </div>
          </div>
        </div>

        <!-- Chat -->
        <div class="chat-container" id="chatContainer">
          <!-- Messages injected by JS -->
        </div>

        <!-- Dashboard Summary -->
        <h3 style="margin-bottom: var(--space-lg); font-family: var(--font-display);">Overview</h3>
        <div class="dashboard-grid" id="dashboardGrid">
          <!-- Stat cards injected by JS -->
        </div>

      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
