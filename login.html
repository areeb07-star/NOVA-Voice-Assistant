<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — NOVA</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-left">
    <div class="auth-left-content">
      <div class="auth-brand">
        <div class="auth-brand-logo">N</div>
        <div class="auth-brand-text">NOVA</div>
      </div>
      <div class="auth-orb-wrapper">
        <div class="auth-orb"></div>
        <div class="auth-orb-ring"></div>
        <div class="auth-orb-ring"></div>
      </div>
      <h2 class="auth-tagline">Your intelligent companion</h2>
      <p class="auth-subtitle">Talk. Plan. Remember. Achieve.<br>NOVA is ready when you are.</p>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-card">
      <div class="auth-card-header">
        <h1 class="auth-card-title">Welcome back</h1>
        <p class="auth-card-subtitle">Sign in to continue to NOVA</p>
      </div>

      <div class="auth-error" id="loginError">
        <span>⚠️</span>
        <span id="loginErrorText">Invalid email or password.</span>
      </div>

      <form class="auth-form" id="loginForm" novalidate autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="loginEmail">Email</label>
          <div class="input-group">
            <span class="input-icon">✉️</span>
            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com">
          </div>
          <div class="form-error" id="loginEmailError">Please enter a valid email.</div>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <div class="input-group">
            <span class="input-icon">🔒</span>
            <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password">
            <button type="button" class="input-toggle" id="toggleLoginPassword" tabindex="-1">👁️</button>
          </div>
          <div class="form-error" id="loginPasswordError">Password is required.</div>
        </div>

        <div class="auth-options">
          <label class="form-check">
            <input type="checkbox" id="rememberMe">
            <span>Remember me</span>
          </label>
          <a href="#" class="auth-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary auth-submit" id="loginSubmit">
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account?
        <a href="register.html" class="auth-link">Create one</a>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", function (e) {
  e.preventDefault();

  var email = document.getElementById("loginEmail").value.trim();
  var pass  = document.getElementById("loginPassword").value;

  document.getElementById("loginEmailError").classList.remove("show");
  document.getElementById("loginPasswordError").classList.remove("show");
  document.getElementById("loginError").classList.remove("show");

  var bad = false;
  if (email.indexOf("@") === -1 || email.indexOf(".") === -1) {
    document.getElementById("loginEmailError").classList.add("show");
    bad = true;
  }
  if (pass.length < 6) {
    document.getElementById("loginPasswordError").classList.add("show");
    bad = true;
  }
  if (bad) return;

  // Save + redirect
  var stored = localStorage.getItem("nova-user-name") || email.split("@")[0];
  localStorage.setItem("nova-user-name", stored);
  localStorage.setItem("nova-auth-token", "token-" + Date.now());
  window.location.href = "dashboard.html";
});

// password toggle
document.getElementById("toggleLoginPassword").addEventListener("click", function(){
  var p = document.getElementById("loginPassword");
  p.type = p.type === "password" ? "text" : "password";
});
</script>
</body>
</html>
