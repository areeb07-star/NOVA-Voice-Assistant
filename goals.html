<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goals — NOVA</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    .goals-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
      margin-bottom: var(--space-xl);
      flex-wrap: wrap;
    }

    .goals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-lg);
    }

    .goal-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      transition: all var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .goal-card:hover {
      border-color: var(--border-glass);
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .goal-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--gradient-primary);
    }

    .goal-card.violet::before { background: linear-gradient(135deg, #8b5cf6, #ec4899); }
    .goal-card.pink::before   { background: linear-gradient(135deg, #ec4899, #f59e0b); }
    .goal-card.green::before  { background: linear-gradient(135deg, #10b981, #22d3ee); }
    .goal-card.cyan::before   { background: linear-gradient(135deg, #22d3ee, #8b5cf6); }

    .goal-icon {
      font-size: 1.8rem;
      margin-bottom: var(--space-md);
    }

    .goal-title {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: var(--space-xs);
    }

    .goal-category {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: var(--space-lg);
    }

    .goal-progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: var(--space-sm);
    }

    .goal-progress-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-weight: 600;
    }

    .goal-progress-percent {
      font-family: var(--font-display);
      font-size: 1.3rem;
      font-weight: 800;
      background: var(--gradient-text);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .goal-target {
      font-size: 0.75rem;
      color: var(--text-dim);
      margin-top: var(--space-md);
    }

    @media (max-width: 768px) {
      .goals-header {
        flex-direction: column;
        align-items: stretch;
      }

      .goals-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="dashboard-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">N</div>
        <div class="sidebar-brand">NOVA</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section-label">Main</div>
        <a href="dashboard.html" class="nav-item"><span class="nav-icon">⌂</span><span class="nav-label">Dashboard</span></a>
        <div class="nav-section-label">Organize</div>
        <a href="reminders.html" class="nav-item"><span class="nav-icon">⏰</span><span class="nav-label">Reminders</span></a>
        <a href="notes.html" class="nav-item"><span class="nav-icon">📝</span><span class="nav-label">Notes</span></a>
        <a href="shopping.html" class="nav-item"><span class="nav-icon">🛒</span><span class="nav-label">Shopping</span></a>
        <a href="expenses.html" class="nav-item"><span class="nav-icon">💰</span><span class="nav-label">Expenses</span></a>
        <a href="study_plans.html" class="nav-item"><span class="nav-icon">📚</span><span class="nav-label">Study Plans</span></a>
        <a href="goals.html" class="nav-item active"><span class="nav-icon">🎯</span><span class="nav-label">Goals</span></a>
        <div class="nav-divider"></div>
        <a href="profile.html" class="nav-item"><span class="nav-icon">⚙</span><span class="nav-label">Profile</span></a>
        <a href="login.html" class="nav-item"><span class="nav-icon">↪</span><span class="nav-label">Logout</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="avatar avatar-sm">AS</div>
          <div class="sidebar-user-info">
            <div class="sidebar-user-name" id="sidebarUserName">Arjun Sharma</div>
            <div class="sidebar-user-role">Student</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-content" id="mainContent">
      <header class="topbar">
        <div class="topbar-left">
          <button class="hamburger" aria-label="Toggle menu">☰</button>
          <div class="topbar-greeting">
            <div class="greeting-title">Turn Ambitions Into Achievements.</div>
            <div class="greeting-subtitle">Track your goals and celebrate progress.</div>
          </div>
        </div>
        <div class="topbar-right">
          <button class="topbar-icon-btn" data-notifications aria-label="Notifications">🔔<span class="notification-dot"></span></button>
          <div class="topbar-avatar"><div class="avatar">AS</div></div>
        </div>
      </header>

      <div class="page-content">
        <div class="goals-header">
          <h2 style="font-family: var(--font-display);">Your Goals</h2>
          <button class="btn btn-primary" id="newGoalBtn">+ New Goal</button>
        </div>

        <div class="goals-grid" id="goalsGrid">
          <!-- Goals injected by JS -->
        </div>
      </div>
    </div>
  </div>

  <!-- New Goal Modal -->
  <div class="modal-overlay" id="goalModal">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title">🎯 New Goal</h3>
        <button class="modal-close" data-close-modal aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="goalTitle">Goal Title <span class="required">*</span></label>
          <input type="text" id="goalTitle" class="form-input" placeholder="e.g. Complete Python Course" required>
          <div class="form-error" id="goalTitleError">Goal title is required.</div>
        </div>
        <div class="form-group">
          <label class="form-label" for="goalCategory">Category</label>
          <select id="goalCategory" class="form-select">
            <option value="Education">Education</option>
            <option value="Career">Career</option>
            <option value="Project">Project</option>
            <option value="Personal">Personal</option>
            <option value="Health">Health</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="goalTarget">Target Date</label>
          <input type="date" id="goalTarget" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="goalProgress">Initial Progress (%)</label>
          <input type="number" id="goalProgress" class="form-input" value="0" min="0" max="100">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" data-close-modal>Cancel</button>
        <button class="btn btn-primary" id="saveGoalBtn">Create Goal</button>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/goals.js"></script>
</body>
</html>
